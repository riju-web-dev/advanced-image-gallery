<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Gallery</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to right, #141e30, #243b55);
    color: white;
    text-align: center;
}

h1 { margin: 20px; }


.search {
    padding: 10px;
    width: 80%;
    border-radius: 20px;
    border: none;
}


.filters {
    margin-top: 10px;
}
.filters button {
    margin: 5px;
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    background: cyan;
    cursor: pointer;
}


.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}


.card {
    text-align: center;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.card img:hover {
    transform: scale(1.05);
}

.card p {
    margin-top: 5px;
}

/* Lightbox */
.lightbox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.lightbox img {
    width: 90%;
    max-width: 500px;
    border-radius: 10px;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 30px;
    cursor: pointer;
}

.controls {
    margin-top: 10px;
}

.controls button, .controls a {
    margin: 5px;
    padding: 10px;
    border: none;
    background: cyan;
    cursor: pointer;
    border-radius: 5px;
    text-decoration: none;
    color: black;
}

@media (max-width: 768px) {
    .gallery {
        grid-template-columns: 1fr;
    }

    .search {
        width: 90%;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
}
</style>
</head>

<body>

<h1>📸 Image Gallery</h1>

<input class="search" type="text" placeholder="Search..." onkeyup="searchImg(this.value)">

<div class="filters">
    <button onclick="filterImg('all')">All</button>
    <button onclick="filterImg('marvel')">Marvel</button>
    <button onclick="filterImg('nature')">Nature</button>
    <button onclick="filterImg('animal')">Animals</button>
</div>

<div class="gallery">

<div class="card" data-name="ironman" data-cat="marvel">
    <img src="photos/iron man.jpg" onclick="openImg(this)">
    <p>Iron Man</p>
</div>

<div class="card" data-name="spiderman" data-cat="marvel">
    <img src="photos/spiderman.jpg" onclick="openImg(this)">
    <p>Spider Man</p>
</div>

<div class="card" data-name="nature" data-cat="nature">
    <img src="photos/nature.avif" onclick="openImg(this)">
    <p>Nature</p>
</div>
<div class="card" data-name="Flower" data-cat="nature">
    <img src="photos/flower.avif" onclick="openImg(this)">
    <p>Flower</p>
</div>
<div class="card" data-name="Bird" data-cat="nature">
    <img src="photos/bird.jpg" onclick="openImg(this)">
    <p>Bird</p>
</div>
<div class="card" data-name="Deadpool" data-cat="marvel">
    <img src="photos/deadpool.jpg" onclick="openImg(this)">
    <p>Deadpool</p>
</div>

<div class="card" data-name="Bird" data-cat="nature">
    <img src="photos/bird2.jpg" onclick="openImg(this)">
    <p>Bird</p>
</div>
<div class="card" data-name="hulk" data-cat="marvel">
    <img src="photos/hulk.webp" onclick="openImg(this)">
    <p>Hulk</p>
</div>
<div class="card" data-name="Groot" data-cat="marvel">
    <img src="photos/groot.jpg" onclick="openImg(this)">
    <p>Groot</p>
</div>
<div class="card" data-name="hulk" data-cat="marvel">
    <img src="photos/hulk2.jpg" onclick="openImg(this)">
    <p>Hulk</p>
</div>
<div class="card" data-name="Captain America" data-cat="marvel">
    <img src="photos/captain america2.webp" onclick="openImg(this)">
    <p>Captain America</p>
</div>
<div class="card" data-name="iron man" data-cat="marvel">
    <img src="photos/iron man2.jpg" onclick="openImg(this)">
    <p>iron man</p>
</div>
<div class="card" data-name="Thor" data-cat="marvel">
    <img src="photos/thor.jpg" onclick="openImg(this)">
    <p>Thor</p>
</div>
<div class="card" data-name="Mjolnir" data-cat="marvel">
    <img src="photos/Mjolnir.jpg" onclick="openImg(this)">
    <p>Mjolnir</p>
</div>
<div class="card" data-name="Thanos" data-cat="marvel">
    <img src="photos/thanos.jpg" onclick="openImg(this)">
    <p>Thanos</p>
</div>
<div class="card" data-name="Toy" data-cat="marvel">
    <img src="photos/toy.jpg" onclick="openImg(this)">
    <p>Toy</p>
</div>
<div class="card" data-name="Batman" data-cat="marvel">
    <img src="photos/batman.jpg" onclick="openImg(this)">
    <p>Batman</p>
</div>
<div class="card" data-name="End Game" data-cat="marvel">
    <img src="photos/end game.jpg" onclick="openImg(this)">
    <p>End Game</p>
</div>
<div class="card" data-name="dog" data-cat="animal">
    <img src="photos/dog.avif" onclick="openImg(this)">
    <p>Dog</p>
</div>

<div class="card" data-name="cat" data-cat="animal">
    <img src="photos/little cat.avif" onclick="openImg(this)">
    <p>Little Cat</p>
</div>
<div class="card" data-name="Dear" data-cat="animal">
    <img src="photos/Dear.avif" onclick="openImg(this)">
    <p>Dear</p>
</div>
<div class="card" data-name="Lion" data-cat="animal">
    <img src="photos/Lion.avif" onclick="openImg(this)">
    <p>Lion</p>
</div>



</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="close" onclick="closeImg()">✖</span>
    <img id="lightImg">

    <div class="controls">
        <button onclick="prevImg()">⬅ Prev</button>
        <button onclick="nextImg()">Next ➡</button>
        <a id="downloadBtn" download>⬇ Download</a>
    </div>
</div>

<script>

let currentIndex = 0;

// সব visible card ধরার function
function getVisibleCards() {
    return Array.from(document.querySelectorAll(".card"))
        .filter(card => window.getComputedStyle(card).display !== "none");
}

// Open image
function openImg(img) {
    let visible = getVisibleCards();

    currentIndex = visible.findIndex(card =>
        card.querySelector("img") === img
    );

    document.getElementById("lightbox").style.display = "flex";
    document.getElementById("lightImg").src = img.src;
    document.getElementById("downloadBtn").href = img.src;
}

// Close
function closeImg() {
    document.getElementById("lightbox").style.display = "none";
}

// Next
function nextImg() {
    let visible = getVisibleCards();

    if (visible.length === 0) return;

    currentIndex = (currentIndex + 1) % visible.length;
    updateImg();
}

// Prev
function prevImg() {
    let visible = getVisibleCards();

    if (visible.length === 0) return;

    currentIndex = (currentIndex - 1 + visible.length) % visible.length;
    updateImg();
}

// Update
function updateImg() {
    let visible = getVisibleCards();

    let img = visible[currentIndex].querySelector("img");

    document.getElementById("lightImg").src = img.src;
    document.getElementById("downloadBtn").href = img.src;
}

// Filter
function filterImg(cat) {
    document.querySelectorAll(".card").forEach(card => {
        card.style.display =
            (cat === "all" || card.dataset.cat === cat) ? "block" : "none";
    });
}

// Search
function searchImg(text) {
    document.querySelectorAll(".card").forEach(card => {
        let name = card.dataset.name.toLowerCase();
        card.style.display =
            name.includes(text.toLowerCase()) ? "block" : "none";
    });
}
</script>

</body>
</html>
